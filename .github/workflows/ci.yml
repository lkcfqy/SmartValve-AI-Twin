name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SMARTVALVE_SOURCE_ONLY_CI: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.lock
            requirements-research.lock
            requirements.lock
            build-requirements.lock
      - name: Configure runner paths
        run: |
          {
            echo "SMARTVALVE_EXTERNAL_DATA=${RUNNER_TEMP}/smartvalve-public-data"
            echo "SMARTVALVE_CI_BUILD_SOURCE=${RUNNER_TEMP}/smartvalve-ci-build-source"
            echo "SMARTVALVE_CI_PYTEST_XML=${RUNNER_TEMP}/smartvalve-ci-pytest.xml"
            echo "SMARTVALVE_CI_VENV=${RUNNER_TEMP}/smartvalve-ci-venv"
            echo "COVERAGE_FILE=${RUNNER_TEMP}/smartvalve-ci.coverage"
          } >> "${GITHUB_ENV}"
      - name: Install locked dependencies
        run: |
          set -o pipefail
          mkdir -p "${SMARTVALVE_CI_BUILD_SOURCE}"
          git archive --format=tar HEAD | tar -xf - -C "${SMARTVALVE_CI_BUILD_SOURCE}"
          python -m venv "${SMARTVALVE_CI_VENV}"
          "${SMARTVALVE_CI_VENV}/bin/python" -m pip install --require-hashes -r build-requirements.lock
          "${SMARTVALVE_CI_VENV}/bin/python" -m pip install --require-hashes -r requirements-ci.lock
          "${SMARTVALVE_CI_VENV}/bin/python" -m pip install --no-deps --no-build-isolation "${SMARTVALVE_CI_BUILD_SOURCE}"
          "${SMARTVALVE_CI_VENV}/bin/python" scripts/validate_cpu_quality_environment.py
          "${SMARTVALVE_CI_VENV}/bin/python" scripts/validate_installed_lock_environment.py \
            --lock build-requirements.lock \
            --lock requirements-ci.lock \
            --allow-package smartvalve-ai-twin
      - name: Sync hash-locked public test inputs
        run: |
          "${SMARTVALVE_CI_VENV}/bin/python" -m smartvalve.data.external sync
          "${SMARTVALVE_CI_VENV}/bin/python" scripts/validate_external_artifact_status.py
      - name: Lint and test
        run: |
          "${SMARTVALVE_CI_VENV}/bin/ruff" check .
          "${SMARTVALVE_CI_VENV}/bin/python" -m pytest -p no:cacheprovider --cov=src/smartvalve --cov-report=term-missing --cov-fail-under=75 --junitxml="${SMARTVALVE_CI_PYTEST_XML}"
          "${SMARTVALVE_CI_VENV}/bin/python" -c "import os; from pathlib import Path; from smartvalve.experiments.final_quality_gate import _pytest_counts; c = _pytest_counts(Path(os.environ['SMARTVALVE_CI_PYTEST_XML'])); assert c['tests'] >= 385 and c['failures'] == c['errors'] == c['skipped'] == 0, c"
      - name: Security checks
        run: |
          "${SMARTVALVE_CI_VENV}/bin/bandit" -q -r src scripts research/scripts -ll
          "${SMARTVALVE_CI_VENV}/bin/pip-audit" -r requirements.lock -r build-requirements.lock --disable-pip --strict
          "${SMARTVALVE_CI_VENV}/bin/pip-audit" -r requirements-ci.lock --disable-pip --strict --vulnerability-service osv
          "${SMARTVALVE_CI_VENV}/bin/pip-audit" -r requirements-research.lock --disable-pip --strict
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Validate Compose and build image
        env:
          SMARTVALVE_API_KEY: ci-only-secret-0123456789abcdef0123456789abcdef
          SMARTVALVE_OIDC_CLIENT_ID: ci-only-client
          SMARTVALVE_OIDC_CLIENT_SECRET: ci-only-client-secret-not-for-use
          SMARTVALVE_OIDC_COOKIE_SECRET: ci-only-cookie-secret-0123456789abcdef0123456789abcdef
        run: |
          docker compose config --quiet
          docker compose --env-file .env.example \
            -f compose.yaml -f compose.tls.yaml config --quiet
          docker compose --env-file .env.example \
            -f compose.yaml -f compose.tls.yaml -f compose.sso.yaml config --quiet
          docker build --tag smartvalve-ai-twin:ci .
