name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.lock
            build-requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r build-requirements.lock
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation .
      - name: Lint and test
        run: |
          ruff check src tests dashboard
          pytest --cov=smartvalve --cov-report=term-missing --cov-fail-under=75
      - name: Security checks
        run: |
          bandit -q -r src -ll
          pip-audit -r requirements.lock --disable-pip
      - name: Validate Compose and build image
        env:
          SMARTVALVE_API_KEY: ci-only-secret-0123456789abcdef0123456789abcdef
        run: |
          docker compose config --quiet
          docker build --tag smartvalve-ai-twin:ci .
